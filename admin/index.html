<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>后台 | han-site</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23404040'/%3E%3Ctext x='50' y='68' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EH%3C/text%3E%3C/svg%3E"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/supabase-config.js"></script>
<script src="admin.js" defer></script>
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased">

<!-- 登录 -->
<div id="login" class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <h1 class="text-lg font-semibold mb-1">han-site 后台</h1>
    <p class="text-sm text-neutral-500 mb-6">访问统计 · 留言管理 · 订阅名单</p>
    <form id="login-form" class="space-y-3 bg-white border border-neutral-200 rounded-lg p-5">
      <div>
        <label for="email" class="sr-only">邮箱</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="邮箱" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
      </div>
      <div>
        <label for="password" class="sr-only">密码</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="密码" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
      </div>
      <button type="submit" class="w-full h-9 rounded-full bg-neutral-900 text-sm font-medium text-white hover:bg-neutral-700 disabled:opacity-50">
        <span>登录</span>
      </button>
      <p id="login-status" class="text-xs text-red-600" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- 主面板 -->
<div id="app" class="hidden mx-auto max-w-6xl px-6 py-10">
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-lg font-semibold">han-site 后台</h1>
      <p id="who" class="text-sm text-neutral-500"></p>
    </div>
    <div class="flex items-center gap-2">
      <button id="refresh" class="h-8 px-3 rounded-full border border-neutral-200 bg-white text-sm hover:border-neutral-400">刷新</button>
      <button id="logout" class="h-8 px-3 rounded-full border border-neutral-200 bg-white text-sm hover:border-neutral-400">退出</button>
    </div>
  </header>

  <!-- KPI -->
  <section id="kpis" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8"></section>

  <!-- 趋势图 -->
  <section class="bg-white border border-neutral-200 rounded-lg p-5 mb-6">
    <h2 class="text-sm font-semibold mb-4">近 14 天访问量</h2>
    <div id="chart" class="flex items-end gap-1 h-32"></div>
    <div id="chart-legend" class="flex gap-4 mt-3 text-xs text-neutral-500"></div>
  </section>

  <div class="grid md:grid-cols-2 gap-6 mb-6">
    <section class="bg-white border border-neutral-200 rounded-lg p-5">
      <h2 class="text-sm font-semibold mb-3">页面（PV / UV）</h2>
      <div id="paths" class="space-y-2"></div>
    </section>
    <section class="bg-white border border-neutral-200 rounded-lg p-5">
      <h2 class="text-sm font-semibold mb-3">来源</h2>
      <div id="referrers" class="space-y-2"></div>
    </section>
    <section class="bg-white border border-neutral-200 rounded-lg p-5">
      <h2 class="text-sm font-semibold mb-3">设备 / 浏览器</h2>
      <div id="devices" class="space-y-2"></div>
      <div id="browsers" class="space-y-2 mt-4"></div>
    </section>
    <section class="bg-white border border-neutral-200 rounded-lg p-5">
      <h2 class="text-sm font-semibold mb-3">点击事件</h2>
      <div id="events" class="space-y-2"></div>
      <div id="countries" class="space-y-2 mt-4"></div>
    </section>
  </div>

  <!-- 留言 -->
  <section class="bg-white border border-neutral-200 rounded-lg p-5 mb-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold">留言</h2>
      <span id="msg-count" class="text-xs text-neutral-500"></span>
    </div>
    <div id="messages" class="space-y-3"></div>
  </section>

  <!-- 订阅 -->
  <section class="bg-white border border-neutral-200 rounded-lg p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold">订阅名单</h2>
      <button id="copy-subs" class="h-7 px-2 rounded border border-neutral-200 text-xs hover:border-neutral-400">复制邮箱列表</button>
    </div>
    <div id="subscribers" class="space-y-1 text-sm"></div>
  </section>
</div>

</body>
</html>
