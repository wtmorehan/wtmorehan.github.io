<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>后台 | han-site</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23404040'/%3E%3Ctext x='50' y='68' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EH%3C/text%3E%3C/svg%3E"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/supabase-config.js"></script>
<script src="admin.js" defer></script>
<script src="content.js" defer></script>
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased">

<!-- 登录 -->
<div id="login" class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <h1 class="text-lg font-semibold mb-1">han-site 后台</h1>
    <p class="text-sm text-neutral-500 mb-6">访问统计 · 内容编辑 · 留言管理 · 订阅名单</p>
    <form id="login-form" class="space-y-3 bg-white border border-neutral-200 rounded-lg p-5">
      <div>
        <label for="email" class="sr-only">邮箱</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="邮箱" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
      </div>
      <div>
        <label for="password" class="sr-only">密码</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="密码" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
      </div>
      <button type="submit" class="w-full h-9 rounded-full bg-neutral-900 text-sm font-medium text-white hover:bg-neutral-700 disabled:opacity-50">
        <span>登录</span>
      </button>
      <p id="login-status" class="text-xs text-red-600" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- 主面板 -->
<div id="app" class="hidden mx-auto max-w-6xl px-6 py-10">
  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-lg font-semibold">han-site 后台</h1>
      <p id="who" class="text-sm text-neutral-500"></p>
    </div>
    <div class="flex items-center gap-2">
      <button id="refresh" class="h-8 px-3 rounded-full border border-neutral-200 bg-white text-sm hover:border-neutral-400">刷新</button>
      <button id="logout" class="h-8 px-3 rounded-full border border-neutral-200 bg-white text-sm hover:border-neutral-400">退出</button>
    </div>
  </header>

  <!-- 标签页 -->
  <nav class="flex items-center gap-2 mb-6">
    <button data-tab="overview" class="h-8 px-3 rounded-full border border-neutral-200 text-sm">概览</button>
    <button data-tab="content" class="h-8 px-3 rounded-full border border-neutral-200 text-sm">内容</button>
  </nav>

  <!-- ══ 概览 ══ -->
  <section data-panel="overview">
    <div id="kpis" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8"></div>

    <section class="bg-white border border-neutral-200 rounded-lg p-5 mb-6">
      <h2 class="text-sm font-semibold mb-4">近 14 天访问量</h2>
      <div id="chart" class="flex items-end gap-1 h-32"></div>
      <div id="chart-legend" class="flex gap-4 mt-3 text-xs text-neutral-500"></div>
    </section>

    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <section class="bg-white border border-neutral-200 rounded-lg p-5">
        <h2 class="text-sm font-semibold mb-3">页面（PV / UV）</h2>
        <div id="paths" class="space-y-2"></div>
      </section>
      <section class="bg-white border border-neutral-200 rounded-lg p-5">
        <h2 class="text-sm font-semibold mb-3">来源</h2>
        <div id="referrers" class="space-y-2"></div>
      </section>
      <section class="bg-white border border-neutral-200 rounded-lg p-5">
        <h2 class="text-sm font-semibold mb-3">设备 / 浏览器</h2>
        <div id="devices" class="space-y-2"></div>
        <div id="browsers" class="space-y-2 mt-4"></div>
      </section>
      <section class="bg-white border border-neutral-200 rounded-lg p-5">
        <h2 class="text-sm font-semibold mb-3">点击事件</h2>
        <div id="events" class="space-y-2"></div>
        <div id="countries" class="space-y-2 mt-4"></div>
      </section>
    </div>

    <section class="bg-white border border-neutral-200 rounded-lg p-5 mb-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold">留言</h2>
        <span id="msg-count" class="text-xs text-neutral-500"></span>
      </div>
      <div id="messages" class="space-y-3"></div>
    </section>

    <section class="bg-white border border-neutral-200 rounded-lg p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold">订阅名单</h2>
        <button id="copy-subs" class="h-7 px-2 rounded border border-neutral-200 text-xs hover:border-neutral-400">复制邮箱列表</button>
      </div>
      <div id="subscribers" class="space-y-1 text-sm"></div>
    </section>
  </section>

  <!-- ══ 内容 ══ -->
  <section data-panel="content" class="hidden">
    <!-- 发布 -->
    <section class="bg-white border border-neutral-200 rounded-lg p-5 mb-6">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h2 class="text-sm font-semibold">发布到线上</h2>
          <p class="text-xs text-neutral-500 mt-1">渲染 index.html / 文章页 / rss / sitemap 并提交到 GitHub，Pages 自动重建（约 1 分钟生效）。</p>
        </div>
        <button id="btn-publish" class="h-9 px-4 rounded-full bg-neutral-900 text-sm font-medium text-white hover:bg-neutral-700 disabled:opacity-50 shrink-0">发布到线上</button>
      </div>
      <div id="publish-result" class="mt-3 hidden"></div>
      <div class="mt-4 border-t border-neutral-100 pt-3">
        <h3 class="text-xs font-medium text-neutral-500 mb-2">发布历史</h3>
        <div id="publish-log"></div>
      </div>
    </section>

    <!-- 文章 -->
    <section class="bg-white border border-neutral-200 rounded-lg p-5 mb-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold">文章</h2>
        <button id="btn-new-article" class="h-7 px-2 rounded bg-neutral-900 text-xs text-white hover:bg-neutral-700">新建文章</button>
      </div>
      <div id="article-list-wrap">
        <div id="article-list"></div>
      </div>

      <!-- 编辑器 -->
      <div id="editor" class="hidden mt-5 border-t border-neutral-200 pt-5">
        <h3 id="editor-title" class="text-sm font-semibold mb-3">新建文章</h3>
        <div class="grid gap-3 sm:grid-cols-2 mb-3">
          <div>
            <label for="ed-slug" class="block text-xs text-neutral-500 mb-1">slug（URL 路径，创建后不可改）</label>
            <input id="ed-slug" type="text" placeholder="my-new-article" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400 font-mono"/>
          </div>
          <div>
            <label for="ed-title" class="block text-xs text-neutral-500 mb-1">标题</label>
            <input id="ed-title" type="text" placeholder="文章标题" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
          </div>
          <div>
            <label for="ed-status" class="block text-xs text-neutral-500 mb-1">状态</label>
            <select id="ed-status" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400 bg-white">
              <option value="draft">草稿</option>
              <option value="published">已发布</option>
              <option value="archived">已归档</option>
            </select>
          </div>
          <div>
            <label for="ed-minutes" class="block text-xs text-neutral-500 mb-1">阅读时长（分钟）</label>
            <input id="ed-minutes" type="number" min="1" max="120" value="5" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
          </div>
          <div>
            <label for="ed-sort" class="block text-xs text-neutral-500 mb-1">排序（小的在前）</label>
            <input id="ed-sort" type="number" value="0" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
          </div>
          <div>
            <label for="ed-tags" class="block text-xs text-neutral-500 mb-1">标签（逗号分隔）</label>
            <input id="ed-tags" type="text" placeholder="制造业转型, AI 与电力" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"/>
          </div>
        </div>
        <div class="mb-3">
          <label for="ed-summary" class="block text-xs text-neutral-500 mb-1">摘要（列表页与 SEO 用）</label>
          <textarea id="ed-summary" rows="2" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400"></textarea>
        </div>
        <div class="mb-3">
          <label for="ed-body" class="block text-xs text-neutral-500 mb-1">正文（Markdown）</label>
          <textarea id="ed-body" rows="16" placeholder="## 小标题

正文段落，**粗体**、*斜体*、- 列表、[链接](https://example.com)" class="w-full rounded-lg border border-neutral-200 px-3 py-2 text-sm font-mono outline-none focus:border-neutral-400 leading-relaxed"></textarea>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <button id="btn-save-article" class="h-9 px-4 rounded-full bg-neutral-900 text-sm font-medium text-white hover:bg-neutral-700 disabled:opacity-50">保存</button>
          <button id="btn-preview" class="h-9 px-3 rounded-full border border-neutral-200 text-sm hover:border-neutral-400">预览</button>
          <button id="btn-cancel-edit" class="h-9 px-3 rounded-full border border-neutral-200 text-sm hover:border-neutral-400">返回列表</button>
          <span id="save-hint" class="text-xs text-neutral-500"></span>
        </div>
        <div class="mt-4">
          <h4 class="text-xs font-medium text-neutral-500 mb-2">预览</h4>
          <div id="ed-preview" class="prose-article rounded-lg border border-neutral-200 bg-white p-5 text-sm leading-relaxed text-neutral-700">
            <p class="text-sm text-neutral-400">预览会显示在这里</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 首页区块 -->
    <section class="bg-white border border-neutral-200 rounded-lg p-5">
      <h2 class="text-sm font-semibold mb-1">首页区块</h2>
      <p class="text-xs text-neutral-500 mb-3">改完点「发布到线上」才会生效。</p>
      <div id="block-list" class="space-y-3"></div>
      <p id="block-hint" class="text-xs text-neutral-500 mt-3"></p>
    </section>
  </section>
</div>

</body>
</html>
